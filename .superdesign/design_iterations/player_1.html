<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Now Playing • LyriQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="musicapp_theme_1.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .bounce-in {animation: bounceIn 1s cubic-bezier(.4,0,.2,1) both;}
    @keyframes bounceIn {0%{opacity:0;transform:translateY(40px) scale(.97);}70%{opacity:1;transform:translateY(-8px) scale(1.01);}100%{transform:none;}}
    .fade-in {animation: fadeIn 0.88s cubic-bezier(.4,0,.2,1) both;}
    @keyframes fadeIn {0%{opacity:0;transform:scale(.98);}100%{opacity:1;transform:none;}}
    .player-btn:active {animation:ripple 0.4s cubic-bezier(.4,0,.2,1);} 
    @keyframes ripple {0%{box-shadow:0 0 8px 4px #08e0c699;} 100%{box-shadow:none;}}
    .prog-fill {transition:width 0.7s cubic-bezier(.4,0,.2,1);}
  </style>
</head>
<body class="fade-in" style="background:var(--background); color:var(--foreground); font-family:var(--font-sans); min-height:100vh;">
  <div class="flex flex-col min-h-screen">
    <div class="flex items-center justify-between pt-5 px-4 mb-2 fade-in" style="animation-delay:.2s;">
      <div class="bg-[var(--secondary)] p-2 rounded-full hover:scale-110 transition-transform" tabindex="0"><i data-lucide="chevron-down"></i></div>
      <div class="text-xs font-semibold uppercase tracking-widest text-[var(--muted-foreground)]">Now Playing</div>
      <button class="bg-[var(--secondary)] p-2 rounded-full hover:scale-110 transition-transform" tabindex="0" aria-label="Song actions"><i data-lucide="more-horizontal"></i></button>
    </div>
    <main class="flex-1 flex flex-col gap-4 items-center px-4 justify-start mt-1 pb-10">
      <img src="https://images.unsplash.com/photo-1465101178521-c1a9136a3fd0?q=80&w=360" class="w-[85vw] max-w-xs aspect-square rounded-3xl object-cover shadow-xl mt-2 mb-6 bounce-in" alt="Currently Playing Cover"/>
      <div class="flex flex-col items-center w-full">
        <div class="flex justify-between w-full max-w-xs mb-1">
          <div class="flex items-center gap-2">
            <div class="text-lg font-semibold leading-none">Midnight Riffs</div>
            <button aria-label="Like" class="ml-1 transform-gpu transition-transform duration-200 hover:scale-110 focus:ring-2 focus:ring-[var(--primary)]"><i data-lucide="heart"></i></button>
          </div>
          <button aria-label="Queue" class="transform-gpu transition-transform duration-200 hover:scale-110 focus:ring-2 focus:ring-[var(--primary)]"><i data-lucide="list-music"></i></button>
        </div>
        <div class="text-sm text-[var(--muted-foreground)] w-full max-w-xs mb-4">Nebula • Dream Rider</div>
      </div>
      <div class="w-full max-w-xs mb-2 flex gap-3 items-center px-2">
        <span class="text-xs">1:22</span>
        <div class="relative flex-1 h-1.5 rounded-full bg-[var(--muted)] overflow-hidden">
          <div class="absolute h-full left-0 top-0 rounded-full transition-all bg-[var(--primary)] prog-fill" style="width:52%"></div>
        </div>
        <span class="text-xs">3:47</span>
      </div>
      <div class="flex items-center justify-center gap-7 my-3 fade-in" style="animation-delay:0.88s;">
        <button aria-label="Prev track" class="p-3 rounded-full bg-[var(--secondary)] hover:bg-[var(--primary-accent)] active:scale-95 player-btn transition"><i data-lucide="skip-back"></i></button>
        <button aria-label="Play/Pause" class="p-4 rounded-full bg-[var(--primary)] shadow-lg ring-4 ring-[var(--primary)] ring-opacity-25 hover:scale-110 active:scale-95 transition player-btn"><i data-lucide="play" style="color:var(--background)"></i></button>
        <button aria-label="Next track" class="p-3 rounded-full bg-[var(--secondary)] hover:bg-[var(--primary-accent)] active:scale-95 player-btn transition"><i data-lucide="skip-forward"></i></button>
      </div>
      <div class="flex justify-between w-full max-w-xs fade-in" style="animation-delay:1.1s;">
        <button aria-label="Mumble Lyric Assistant" class="flex items-center gap-1 text-xs py-1 px-2 bg-[var(--muted)] rounded-full hover:bg-[var(--accent)] focus:ring-2 focus:ring-[var(--accent)]"><i data-lucide="mic"></i> Mumble</button>
        <button aria-label="Share" class="flex items-center gap-1 text-xs py-1 px-2 bg-[var(--muted)] rounded-full hover:bg-[var(--accent)] focus:ring-2 focus:ring-[var(--accent)]"><i data-lucide="share"></i> Share</button>
        <button aria-label="Add to Playlist" class="flex items-center gap-1 text-xs py-1 px-2 bg-[var(--muted)] rounded-full hover:bg-[var(--accent)] focus:ring-2 focus:ring-[var(--accent)]"><i data-lucide="plus"></i> Playlist</button>
      </div>
      <div class="mt-6 w-full max-w-xs px-3 fade-in" style="animation-delay:1.3s;">
        <button aria-label="Show Lyrics" class="w-full bg-[var(--primary)] text-[var(--background)] rounded-xl py-3 font-semibold flex items-center justify-center gap-2 transition-all hover:scale-[1.05] focus:ring-2 focus:ring-[var(--primary)]"><i data-lucide="music"></i> <span>Show Lyrics</span>
        </button>
      </div>
    </main>
  </div>
  <script>lucide.createIcons()</script>
</body>
</html>
