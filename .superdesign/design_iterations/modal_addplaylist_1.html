<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add to Playlist • LyriQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="musicapp_theme_1.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .modal-fade {
      animation: modalFadeIn 0.6s cubic-bezier(.42,0,.18,1) both;
    }
    @keyframes modalFadeIn {
      0% {opacity: 0; transform: scale(.92) translateY(32px);}
      90% { opacity: 1; transform: scale(1.03) translateY(-3px); }
      100% {opacity: 1; transform:none;}
    }
    .playlist-card-bounce {animation: cardBounce .53s cubic-bezier(.44,0,.2,1) both;}
    @keyframes cardBounce {0%{opacity:0;transform:scale(.95) translateY(24px);}100%{opacity:1;transform:none;}}
  </style>
</head>
<body style="background:rgba(7,10,14,0.89); color:var(--foreground); font-family:var(--font-sans);">
  <div class="fixed inset-0 flex items-center justify-center z-50" style="backdrop-filter:blur(6px); background:rgba(10,16,21,0.83);">
    <div class="modal-fade rounded-2xl bg-[var(--secondary)] shadow-xl max-w-md w-full p-7 relative border border-[var(--border)]">
      <button aria-label="Close modal" class="absolute top-5 right-5 bg-[var(--background)] rounded-full p-2 shadow hover:scale-110 active:scale-95 focus:ring-2 focus:ring-[var(--primary)] transition"><i data-lucide="x"></i></button>
      <h2 class="text-xl font-bold mb-5 text-center">Add to Playlist</h2>
      <div class="flex flex-col gap-4 mb-6 max-h-60 overflow-y-auto">
        <button class="flex items-center gap-3 bg-[var(--muted)] p-3 rounded-xl playlist-card-bounce hover:scale-[1.04] focus:scale-[1.04] transition" aria-label="Morning Vibes, 14 songs">
          <img src="https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?q=80&w=64" class="h-12 w-12 rounded-lg object-cover" alt="Playlist cover"/>
          <div class="flex-1 text-left">
            <div class="font-semibold">Morning Vibes</div>
            <div class="text-xs text-[var(--muted-foreground)]">14 songs</div>
          </div>
        </button>
        <button class="flex items-center gap-3 bg-[var(--muted)] p-3 rounded-xl playlist-card-bounce hover:scale-[1.04] focus:scale-[1.04] transition" aria-label="Late Night, 22 songs">
          <img src="https://images.unsplash.com/photo-1470229538611-16ba8c7ffbd7?q=80&w=64" class="h-12 w-12 rounded-lg object-cover" alt="Playlist cover"/>
          <div class="flex-1 text-left">
            <div class="font-semibold">Late Night</div>
            <div class="text-xs text-[var(--muted-foreground)]">22 songs</div>
          </div>
        </button>
      </div>
      <form class="flex gap-2 mb-5">
        <input type="text" class="flex-1 rounded-lg p-2 bg-[var(--background)] text-[var(--foreground)] focus:ring-2 focus:ring-[var(--primary)] transition" placeholder="New playlist name..." aria-label="New Playlist Name"/>
        <button type="submit" class="rounded-lg bg-[var(--primary)] text-[var(--background)] px-4 py-2 font-semibold transition hover:scale-105" aria-label="Create New Playlist"><i data-lucide="plus"></i></button>
      </form>
      <div class="flex gap-3 mt-2">
        <button class="flex-1 rounded-lg bg-[var(--primary)] py-3 font-semibold text-[var(--background)] hover:scale-105 focus:scale-105 transition" aria-label="Confirm Add">Add</button>
        <button class="flex-1 rounded-lg bg-[var(--muted)] py-3 font-semibold text-[var(--foreground)] hover:scale-102 focus:scale-105 transition" aria-label="Cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script>lucide.createIcons()</script>
</body>
</html>
