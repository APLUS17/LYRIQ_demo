<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LyriQ Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="musicapp_theme_1.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .fade-down {animation: fadeDown 0.7s cubic-bezier(.4,0,.2,1) both; }
    @keyframes fadeDown { 0%{opacity:0;transform:translateY(-24px);} 100%{opacity:1;transform:none;} }
    .fade-in {animation: fadeIn 0.82s cubic-bezier(.4,0,.2,1) both;}
    @keyframes fadeIn {0%{opacity:0;transform:scale(.98);}100%{opacity:1;transform:none;}}
  </style>
</head>
<body class="fade-in" style="background:var(--background); color:var(--foreground); font-family:var(--font-sans); min-height:100vh;">
  <header class="flex items-center px-4 pt-4 pb-2 bg-[var(--background)] sticky top-0 z-10 fade-down">
    <button aria-label="Back" class="p-2 mr-2 hover:scale-110 transition-transform" style="color:var(--primary); background:none"><i data-lucide="arrow-left"></i></button>
    <input autofocus type="search" aria-label="Search bar" class="flex-1 py-2 px-4 rounded-xl bg-[var(--secondary)] text-base outline-none border-none font-normal focus:ring-2 focus:ring-[var(--primary)] transition-all" placeholder="Search songs, albums, artists..." style="color:var(--foreground); font-family:var(--font-sans);"/>
  </header>
  <main class="px-4 pt-3 pb-24 max-w-2xl mx-auto fade-in" style="animation-delay:0.15s;">
    <div class="mb-6 fade-in" style="animation-delay:0.2s;">
      <div class="text-xs text-[var(--muted-foreground)] mb-2 font-semibold uppercase tracking-widest">Recent searches</div>
      <div class="flex flex-wrap gap-2">
        <span class="bg-[var(--secondary)] text-[var(--primary)] rounded-full px-3 py-1 text-xs font-semibold cursor-pointer hover:bg-[var(--muted)] scale-95 transition-all" aria-label="Recent search Dream Rider">Dream Rider</span>
        <span class="bg-[var(--secondary)] text-[var(--primary)] rounded-full px-3 py-1 text-xs font-semibold cursor-pointer hover:bg-[var(--muted)] scale-95 transition-all" aria-label="Recent search Jazz Reloaded">Jazz Reloaded</span>
        <span class="bg-[var(--secondary)] text-[var(--primary)] rounded-full px-3 py-1 text-xs font-semibold cursor-pointer hover:bg-[var(--muted)] scale-95 transition-all" aria-label="Recent search Nebula">Nebula</span>
      </div>
    </div>
    <div class="mb-7 fade-in" style="animation-delay:0.4s;">
      <div class="text-xs text-[var(--muted-foreground)] mb-2 font-semibold uppercase tracking-widest">Top Results</div>
      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-3 p-3 rounded-xl bg-[var(--secondary)] shadow hover:scale-[1.04] active:scale-95 focus-within:ring-2 focus-within:ring-[var(--primary)] transition">
          <img src="https://images.unsplash.com/photo-1470229538611-16ba8c7ffbd7?q=80&w=80" class="h-12 w-12 rounded-lg object-cover fade-in" alt="Cover"/>
          <div class="flex-1 min-w-0">
            <div class="font-semibold truncate">Dream Rider</div>
            <div class="text-xs text-[var(--muted-foreground)]">Pop • Album</div>
          </div>
          <button class="ml-2 px-2 py-1 rounded text-xs font-medium shadow hover:scale-105 transition" style="background:var(--primary); color:var(--background);" aria-label="Play Dream Rider">Play</button>
        </div>
        <div class="flex items-center gap-3 p-3 rounded-xl bg-[var(--secondary)] shadow hover:scale-[1.04] active:scale-95 focus-within:ring-2 focus-within:ring-[var(--primary)] transition">
          <img src="https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?q=80&w=80" class="h-12 w-12 rounded-lg object-cover fade-in" alt="Cover"/>
          <div class="flex-1 min-w-0">
            <div class="font-semibold truncate">Jazz Reloaded</div>
            <div class="text-xs text-[var(--muted-foreground)]">Jazz • Playlist</div>
          </div>
          <button class="ml-2 px-2 py-1 rounded text-xs font-medium shadow hover:scale-105 transition" style="background:var(--primary); color:var(--background);" aria-label="Add Jazz Reloaded">Add</button>
        </div>
      </div>
    </div>
    <div class="fade-in" style="animation-delay:0.5s;">
      <div class="text-xs text-[var(--muted-foreground)] mb-2 font-semibold uppercase tracking-widest">Suggestions</div>
      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-[var(--muted)] active:scale-95 transition cursor-pointer fade-in" style="animation-delay:0.75s;"><i data-lucide="user" class="text-[var(--primary)]"></i><span class="font-medium">Artists</span></div>
        <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-[var(--muted)] active:scale-95 transition cursor-pointer fade-in" style="animation-delay:0.87s;"><i data-lucide="music-2" class="text-[var(--primary)]"></i><span class="font-medium">Songs</span></div>
        <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-[var(--muted)] active:scale-95 transition cursor-pointer fade-in" style="animation-delay:1.0s;"><i data-lucide="disc-3" class="text-[var(--primary)]"></i><span class="font-medium">Albums</span></div>
        <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-[var(--muted)] active:scale-95 transition cursor-pointer fade-in" style="animation-delay:1.13s;"><i data-lucide="users" class="text-[var(--primary)]"></i><span class="font-medium">Collaborators</span></div>
      </div>
    </div>
  </main>
  <script>lucide.createIcons()</script>
</body>
</html>
